<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Pawsikat</title>
  <meta name="description" content="Secure admin login for Pawsikat team members." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p>Access the internal Pawsikat admin dashboard.</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="admin" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required />
      </div>

      <div class="login-actions">
        <span class="password-hint">Demo credentials: admin / pawsikat123</span>
        <button type="submit" class="primary-btn">Log In</button>
      </div>
    </form>

    <div id="loginNotice" class="notice"></div>
  </div>

  <script>
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'pawsikat123';
    const notice = document.getElementById('loginNotice');

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === ADMIN_USER && password === ADMIN_PASS) {
        localStorage.setItem('pawsikat_admin_logged_in', 'true');
        notice.className = 'notice success';
        notice.textContent = 'Login successful. Redirecting...';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      } else {
        notice.className = 'notice error';
        notice.textContent = 'Invalid username or password. Please try again.';
      }
    });
  </script>
</body>
</html>
